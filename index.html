<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Impulso Lector: la aventura del examinador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#1b1530;background-image:radial-gradient(#2a2148 1px,transparent 1px);background-size:14px 14px;font-family:'Pixelify Sans',system-ui,sans-serif;color:#1a1424;-webkit-tap-highlight-color:transparent}
body{display:flex;justify-content:center;padding:14px 8px 24px}
#console{width:100%;max-width:470px;background:linear-gradient(160deg,#7d5ad8,#5434b0 60%,#47289a);border-radius:22px 22px 70px 22px;padding:16px 16px 22px;box-shadow:0 8px 0 #2c1870,0 14px 30px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.25)}
#face{position:relative}
#bezel{background:#2b2b3d;border-radius:10px 10px 30px 10px;padding:12px 12px 8px;box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
#bezel .led{display:flex;align-items:center;gap:6px;font-family:'Press Start 2P';font-size:7px;color:#9a9ab8;margin-bottom:8px;letter-spacing:1px}
#bezel .led i{width:7px;height:7px;border-radius:50%;background:#ff4060;box-shadow:0 0 6px #ff4060;display:inline-block}
#screen{position:relative;width:100%;aspect-ratio:3/2;background:#000;overflow:hidden;border-radius:2px}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:3px 6px;background:rgba(16,16,40,.72);color:#f8f8f0;font-size:clamp(11px,3.1vw,14px);font-weight:600;letter-spacing:.5px;pointer-events:none}
#hud .st{color:#f8d838}
#goal{position:absolute;left:6px;top:clamp(22px,6vw,26px);background:#f8d838;color:#1a1424;border:2px solid #1a1424;padding:1px 6px;font-size:clamp(10px,2.9vw,13px);font-weight:700;pointer-events:none;max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#goal:empty{display:none}
#toast{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:#1a1424;color:#f8f8f0;border:2px solid #f8f8f0;padding:4px 8px;font-size:clamp(11px,3vw,14px);max-width:92%;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
#dialog{position:absolute;left:4px;right:4px;bottom:4px;background:#f8f8f0;border:3px solid #1a1424;box-shadow:inset 0 0 0 2px #8aa4e8;border-radius:4px;display:flex;gap:8px;padding:6px 8px;align-items:flex-start;cursor:pointer;max-height:62%}
#dialog[hidden]{display:none}
#dialog.top{bottom:auto;top:4px}
#portrait{width:60px;height:45px;image-rendering:pixelated;background:#cfe0ff;border:2px solid #1a1424;flex:none}
#portrait.off{display:none}
.dtext{flex:1;min-width:0;overflow:auto}
#dname{font-weight:700;color:#5434b0;font-size:clamp(11px,3vw,13px);line-height:1.1}
#dline{font-size:clamp(13px,3.6vw,16px);line-height:1.22;margin-top:2px}
#dialog .nx{position:absolute;right:8px;bottom:3px;font-size:11px;animation:bl .6s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
#brand{font-family:'Press Start 2P';font-size:clamp(8px,2.4vw,11px);color:#e8dcff;text-align:center;margin:12px 0 4px;letter-spacing:1px;text-shadow:2px 2px 0 #2c1870;font-style:italic}
#brand b{color:#f8d838}
#controls{display:grid;grid-template-columns:1fr 1fr;align-items:center;margin-top:10px;touch-action:none;user-select:none;-webkit-user-select:none}
#dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);justify-content:start;margin-left:6px}
#dpad button{background:#26223a;border:none;color:#7a7898;font-size:16px;touch-action:none}
#dpad .u{grid-column:2;grid-row:1;border-radius:6px 6px 0 0}
#dpad .l{grid-column:1;grid-row:2;border-radius:6px 0 0 6px}
#dpad .c{grid-column:2;grid-row:2;background:#26223a;pointer-events:none}
#dpad .r{grid-column:3;grid-row:2;border-radius:0 6px 6px 0}
#dpad .d{grid-column:2;grid-row:3;border-radius:0 0 6px 6px}
#dpad button:active,#dpad button.on{background:#3c3858}
#ab{display:flex;gap:14px;justify-content:flex-end;transform:rotate(-18deg);margin-right:8px}
#ab button{width:58px;height:58px;border-radius:50%;border:none;background:#d2365c;color:#ffd0dc;font-family:'Press Start 2P';font-size:14px;box-shadow:0 4px 0 #861c3a;touch-action:none}
#ab button:active{transform:translateY(3px);box-shadow:0 1px 0 #861c3a}
#ab .b{margin-top:26px}
#ss{grid-column:1/3;display:flex;gap:22px;justify-content:center;margin-top:16px}
#ss button{border:none;background:#3a2c74;color:#d8ccff;font-family:'Press Start 2P';font-size:8px;padding:7px 12px;border-radius:12px;transform:rotate(-12deg);box-shadow:0 3px 0 #22184a}
#panel{position:fixed;inset:0;z-index:50;background:#101832;color:#f8f8f0;border:3px solid #f8f8f0;box-shadow:inset 0 0 0 3px #3a5ab0;border-radius:0;padding:max(10px,env(safe-area-inset-top)) max(12px,calc(50% - 290px)) max(14px,env(safe-area-inset-bottom));overflow:auto;font-size:clamp(14px,3.9vw,17px);line-height:1.3}
#panel[hidden]{display:none}
#panel h2{font-family:'Press Start 2P';font-size:clamp(11px,3.2vw,14px);color:#f8d838;margin:4px 0 10px;line-height:1.5}
#panel h3{font-size:1em;color:#f8d838;margin:14px 0 4px}
#panel .tag{display:inline-block;background:#f8d838;color:#1a1424;padding:1px 6px;font-weight:700;font-size:.8em;margin-bottom:6px}
#panel .q{font-weight:600;margin:6px 0 10px}
.opt{display:block;width:100%;text-align:left;background:#f8f8f0;color:#1a1424;border:3px solid #1a1424;box-shadow:3px 3px 0 #000;padding:6px 10px;margin:7px 0;font:inherit;font-size:.95em;cursor:pointer;border-radius:2px}
.opt .k{font-weight:700;color:#5434b0;margin-right:6px}
.opt.sel{background:#f8d838;outline:2px dashed #fff;outline-offset:2px}
.opt.ok{background:#8ee08e}
.opt.bad{background:#f49a9a}
.opt.dim{opacity:.55}
.opt.main{text-align:center;font-weight:700;background:#8aa4e8}
.opt.main.sel{background:#f8d838}
.fb{border:3px solid #f8f8f0;padding:8px 10px;margin:10px 0;background:#1d2a55}
.fb .r{font-weight:700;font-size:1.05em}
.fb .r.g{color:#8ee08e}.fb .r.b{color:#ff9a9a}
.fb .pg{display:inline-block;margin-top:6px;background:#3a5ab0;padding:1px 6px;font-size:.85em}
.betsy{display:flex;gap:8px;align-items:center;background:#3a1f44;border:2px dashed #ec6cac;padding:6px 8px;margin:8px 0}
.betsy img{width:40px;image-rendering:pixelated;flex:none}
.title{text-align:center}
.scene{position:relative;height:132px;background:linear-gradient(#ead9b2 0 80%,#a06a34 80% 100%);border:3px solid #f8f8f0;overflow:hidden;margin:4px 0 6px}
.scene img{position:absolute;image-rendering:pixelated}
.scene .board{position:absolute;left:33%;right:28%;top:44px;height:50px;background:#2e5a3a;border:4px solid #8a5a2a;color:#e8f0e8;font-family:'Press Start 2P';font-size:7px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.7}
.scene .sb{left:8px;bottom:4px;width:54px;height:120px}
.scene .sd{right:4px;bottom:-72px;width:64px;height:174px}
.scene .kd{left:42%;bottom:4px;width:38px;height:60px;display:none}
.scene .kd.on{display:block;animation:hop .5s steps(3) 2}
@keyframes hop{50%{transform:translateY(-14px)}}
.say{position:absolute;left:66px;top:8px;max-width:46%;background:#f8f8f0;color:#1a1424;border:2px solid #1a1424;padding:3px 7px;font-size:.78em;font-weight:600;z-index:2;line-height:1.2}
.say.kid{background:#cfe8ff;left:auto;right:74px;top:auto;bottom:70px}
.bubble{position:relative;background:#f8f8f0;color:#1a1424;border:3px solid #1a1424;padding:6px 10px;margin:12px 0 4px;font-weight:600}
.bubble:before{content:"";position:absolute;left:26px;top:-12px;border:6px solid transparent;border-bottom-color:#1a1424;border-left-width:0;border-right-width:12px}
.bubble small{display:block;color:#a8306a;font-weight:700;font-size:.8em}
.opt.gone{opacity:.25;text-decoration:line-through}
.pw{border:2px dashed #8ac8ff;padding:4px 8px;margin:8px 0 2px}
.pw .ttl{display:flex;align-items:center;gap:8px;font-weight:700;color:#8ac8ff}
.pw .ttl img{height:24px;image-rendering:pixelated}
.opt.pwb{background:#cfe8ff;font-size:.85em;margin:4px 0;padding:5px 9px}
.opt.pwb[disabled]{opacity:.45}
.logo{font-family:'Press Start 2P';font-size:clamp(20px,7vw,30px);color:#f8d838;line-height:1.35;text-shadow:3px 3px 0 #d2365c,6px 6px 0 #1a1424;margin:10px 0 6px}
.sub{font-weight:700;color:#8aa4e8;margin-bottom:8px}
.chars{display:flex;justify-content:center;gap:22px;margin:10px 0 4px}
.chars img{image-rendering:pixelated}
.chars small{display:block;font-size:.75em;color:#c8c8e0}
#panel input{width:100%;font:inherit;padding:7px 9px;border:3px solid #1a1424;background:#fff;color:#1a1424;margin-top:4px;border-radius:2px}
#panel label{display:block;text-align:left;margin:10px 0 4px;font-weight:600}
.small{font-size:.8em;color:#b8b8d4}
ul.m{padding-left:18px;margin:4px 0}
ul.m li{margin:4px 0}
.timeline{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:6px 0}
.timeline b{color:#f8d838}
.err{border-left:4px solid #ff9a9a;padding:4px 8px;margin:8px 0;background:#1d2a55}
.stars{font-family:'Press Start 2P';color:#f8d838;font-size:clamp(14px,4.5vw,20px);margin:8px 0}
</style>
</head>
<body>
<div id="console">
  <div id="face">
    <div id="bezel">
      <div class="led"><i></i> BATERÍA</div>
      <div id="screen">
        <canvas id="cv" width="720" height="480"></canvas>
        <div id="hud"><span id="hudDay"></span><span class="st" id="hudStars"></span></div>
        <div id="goal"></div>
        <div id="toast"></div>
        <div id="dialog" hidden><canvas id="portrait" width="16" height="12"></canvas><div class="dtext"><div id="dname"></div><div id="dline"></div></div><span class="nx">▼</span></div>
      </div>
    </div>
    <div id="brand">EXAMINADOR <b>ADVANCE</b></div>
    <div id="controls">
      <div id="dpad">
        <button class="u" data-d="up" aria-label="Arriba">▲</button>
        <button class="l" data-d="left" aria-label="Izquierda">◀</button>
        <span class="c"></span>
        <button class="r" data-d="right" aria-label="Derecha">▶</button>
        <button class="d" data-d="down" aria-label="Abajo">▼</button>
      </div>
      <div id="ab"><button class="b" id="bB" aria-label="B">B</button><button id="bA" aria-label="A">A</button></div>
      <div id="ss"><button id="bSel">SELECT</button><button id="bStart">START</button></div>
    </div>
    <div id="panel" hidden></div>
  </div>
</div>

{title:'DÍA 1',sub:'Precursores de la lectura',stations:[
 {x:1,y:8,icon:'casa',name:'Tu casa',time:'06:45',lines:[
  ['N','DÍA 1 · 06:45. Suena el despertador. Hoy parte la aplicación de Impulso Lector en 2° básico.'],
  ['N','Gabriel apunta hacia la ventana, como preguntando algo.'],
  ['P','Tienes razón, Gabriel... ¿dónde estará Betsy?'],
  ['N','Ahh... está en su auto, en el estacionamiento de la escuela. Llegó a las 6 de la mañana.'],
  ['BW','¡Buenos días! Hoy es la prueba de 4° medio, ¿cierto? Llegue tranquilo a las 9, que a esa hora empieza.'],
  ['P','Betsy... es 2° básico. Mejor reviso el manual antes de salir.'],
  ['KID','¡Agú! ¡Ta-ta!'],
  ['N','Gabriel se acomoda en tus brazos. Hoy va contigo.'],
  ['N','En las preguntas puedes usar el superpoder de {k}: el “Abrazo” te da una segunda oportunidad si fallas. Tienes 2 por día.'],
  ['N','Camina con las flechas (o la cruz de abajo). Sigue la flecha amarilla. A = avanzar. SELECT = torpedo.']],
  qs:[
  {q:'¿A qué hora debes llegar al establecimiento?',o:['Antes de las 08:00','A las 09:00, cuando empieza la prueba','A las 08:45, junto con los niños','Da lo mismo, la caja ya está allá'],b:1,e:'Debes tomar resguardos para llegar antes de las 08:00. La prueba parte a las 09:00, pero antes hay mucho que preparar.',p:'21'},
  {q:'¿Qué no puede faltar en tu mochila?',o:['Cédula de identidad, celular cargado, credencial y Manual de Aplicación','Solo la credencial; lo demás lo trae la supervisora','Lápices y gomas para los niños','Una cámara para sacar fotos de recuerdo'],b:1,e:'Cédula, celular cargado, credencial y manual. Lápices, gomas y sacapuntas vienen en la caja-curso, y está prohibido tomar fotos o videos.',p:'21'}]},
 {x:4,y:8,icon:'none',name:'Portón Escuela de Matilla',time:'07:50',lines:[
  ['N','07:50 · Llegas al portón de la Escuela de Matilla. Ni rastro de Betsy... aparentemente.'],
  ['PW','Betsy, ya llegué. Estoy afuera del colegio, ¿dónde está?'],
  ['BW','¡Aquí estoy hace rato! En el estacionamiento, frente a la escuela. ¿No me ves? El auto gris.'],
  ['N','Betsy lleva 45 minutos sentada en su auto, con la radio puesta, a 20 metros del portón.'],
  ['N','Gabriel apunta al auto gris. Adentro, alguien hace señas.'],
  ['B','Ya, ya, me bajo. Toma tu caja. Ojo que creo que es la del Día 2... o la del 1. Una de las dos.'],
  ['P','La reviso, Betsy, gracias.']],
  qs:[
  {q:'Recibes la caja-curso. ¿Qué haces primero?',o:['Reviso la etiqueta de la caja y el sobre complementario para confirmar que corresponden al día y curso','La abro de inmediato para ver qué trae','Confío en Betsy y me voy directo a la sala','Le saco una foto a la etiqueta por si acaso'],b:2,e:'Revisa que la etiqueta de la caja-curso y el sobre complementario correspondan al día y al curso en que te toca aplicar.',p:'21-22'},
  {q:'¿Qué código QR escaneas al inicio de la aplicación?',o:['El de la etiqueta de la caja-curso del día','El de la portada del Formulario Lista de Curso','El del celular de Betsy','Ninguno: el QR es solo para la visita previa'],b:3,e:'Inicio de aplicación: etiqueta de la caja-curso día. Inicio de cada módulo: bolsa del módulo (y en el Día 2, la grabadora). Luego inicias sesión con ClaveÚnica, confirmas los datos del curso y eliges tu rol. La portada del Formulario Lista de Curso se escaneó en la visita previa.',p:'8'}]},
 {x:4,y:4,icon:'direccion',name:'Dirección',time:'08:00',lines:[
  ['D','Buenos días, bienvenido. Ya nos conocemos de la visita previa.'],
  ['BW','Si el director no está, preséntate con el auxiliar nomás, da lo mismo.']],
  qs:[
  {q:'Ya en el establecimiento, ¿qué más debes hacer?',o:['Presentarme ante el director o la autoridad a cargo y reunirme con el docente de apoyo en aula','Ir directo a la sala sin hablar con nadie','Presentarme con quien esté en la portería y listo','Esperar a que Betsy me presente'],b:2,e:'Te presentas y saludas al director o autoridad a cargo. Con el docente de apoyo revisas la programación del día, definen cómo contactarse y coordinan la organización de los estudiantes.',p:'22'},
  {q:'¿Qué conviene consultar con el docente de apoyo antes de comenzar?',o:['El protocolo del colegio si un estudiante se desregula y los apoyos que requieren los estudiantes con NEE','La clave del wifi','A qué hora es el almuerzo de los profesores','Si me puede reemplazar leyendo las instrucciones'],b:-1,e:'El protocolo ante desregulación se consulta antes de la aplicación, y es el profesor quien interactúa con el estudiante, no el examinador. El docente de apoyo es quien más conoce los requerimientos de cada estudiante.',p:'10 y 27'}]},
 {x:8,y:4,icon:'sala',name:'Sala de 2° básico',time:'08:20',lines:[
  ['N','Sala de 2° básico. Tu dupla viene llegando.'],
  ['BW','El parlante es para poner música en el recreo, ¿cierto? A los niños les encanta.']],
  qs:[
  {q:'¿Hasta qué hora tienes para entrar a la sala?',o:['A más tardar a las 08:20','A las 08:45','A las 09:00','Cuando Betsy avise'],b:3,e:'Debes ingresar a la sala a más tardar a las 08:20, para tener tiempo de organizar el material.',p:'22'},
  {q:'Día 1: ¿qué haces con el parlante y el pendrive al llegar a la sala?',o:['Cargo el parlante y compruebo que funcione con el pendrive','Nada, se usan recién en el Módulo 2','Pongo música para animar el ambiente','Se los paso al docente de apoyo'],b:2,e:'Al inicio del Día 1 cargas el parlante y pruebas que funcione con el pendrive. Se usa en la Actividad 8 (Comprensión oral) del Módulo 2.',p:'22 y 30'},
  {q:'Al abrir la caja ves un sello GRIS. ¿Qué significa?',o:['Que el proveedor de aplicación ya revisó la caja y su material','Que viene directo de la imprenta, sin revisar','Que es material de contingencia','Que es la caja del Día 2'],b:-1,e:'Sello rojo: directo de la imprenta, sin revisión. Sello gris: revisada por el proveedor. Los dos sellos azules del reverso de la tapa sirven para cerrar la caja al final del día.',p:'22'},
  {q:'Antes de que entren los niños, ¿qué escribes en la pizarra?',o:['Los nombres de los dos examinadores','El horario del recreo','Las respuestas del ejemplo','Nada, la pizarra no se toca'],b:-1,e:'Los nombres de los dos examinadores quedan escritos en la pizarra durante toda la aplicación. Además: mesas ordenadas para circular, material pedagógico cubierto o retirado, y un lápiz y una goma en cada puesto.',p:'23-24'},
  {q:'Aparece un estudiante que NO está en el Formulario Lista de Curso. ¿Qué haces?',o:['Pido el libro de clases: si está registrado, lo incorporo con material excedente; si no figura, no puede rendir','Lo dejo rendir con la prueba de un compañero ausente','Lo mando de vuelta a su casa','Le pido a Betsy que lo inscriba por teléfono'],b:3,e:'Si figura en el libro de clases, lo incorporas usando material excedente. Si no figura, no puede rendir las pruebas ni recibir el Cuestionario Apoderados(as).',p:'23 y 48'}]},
 {x:8,y:8,icon:'patio',name:'Formación afuera de la sala',time:'08:30',lines:[
  ['T','Hola, soy la docente de apoyo en aula. ¿Formamos al curso?'],
  ['BW','Que entren todos juntos nomás y se sienten donde quieran, total es una prueba.'],
  ['K','¡Tíooo! ¿Es con nota?']],
  qs:[
  {q:'¿Cómo y a qué hora se forman los estudiantes?',o:['A las 08:30, afuera de la sala, según el orden del Formulario Lista de Curso','A las 09:00, por orden de estatura','Que entren como quieran y se sienten donde quieran','A las 08:00 en el patio central'],b:2,e:'Con ayuda del docente de apoyo, a las 08:30 forman al curso afuera de la sala, en el orden de la lista del Formulario Lista de Curso.',p:'24'},
  {q:'¿Cuál es la hora límite para que los estudiantes ingresen a la sala?',o:['08:45','08:30','09:00','09:15'],b:-1,e:'Los estudiantes deben ingresar a más tardar a las 08:45. Administra tu tiempo según ese límite.',p:'24'},
  {q:'¿Cómo hacen ingresar a los estudiantes?',o:['Los llamo por nombre, apellido y n° de lista, verifico que el n° del cuadernillo coincida, se lo entrego y registro la asistencia; se sientan en su puesto habitual','Dejo los cuadernillos en una mesa y cada uno saca uno','Reparto al azar, total todos tienen la misma forma','Los siento por orden alfabético en puestos nuevos'],b:2,e:'Todos rinden la misma forma, pero el número de prueba es único para cada estudiante. Asistencia en el Formulario Lista de Curso a medida que entregas.',p:'24-26'},
  {q:'Un estudiante está ausente. ¿Qué haces con su cuadernillo?',o:['Dejo su puesto vacío y no le asigno su cuadernillo a otro estudiante','Se lo doy al estudiante nuevo','Lo uso de ejemplo en la pizarra','Lo boto para no confundirme'],b:-1,e:'El puesto queda vacío y su cuadernillo no se asigna a nadie más.',p:'24'}]},
 {x:12,y:8,icon:'modulo',name:'Módulo 1 (Act. 1 a 4)',time:'09:00',lines:[
  ['N','09:00 · MÓDULO 1: Precursores de la lectura. Actividades 1 a 4 (conciencia fonológica y conocimiento de lo impreso).'],
  ['BW','Las instrucciones explícalas a tu manera, más cortitas, que los niños se aburren.']],
  qs:[
  {q:'¿Cómo das las instrucciones del Día 1?',o:['Muestro la lámina de apoyo a todo el curso y leo textual las instrucciones del reverso, sin improvisar','Las resumo con mis palabras para que sea más simple','Las escribo en la pizarra','Le pido al docente de apoyo que las lea'],b:1,e:'Las láminas son obligatorias. Las instrucciones están redactadas como guion: no se improvisan, simplifican ni sobreexplican. Mientras responden, repites la indicación destacada en negrita.',p:'31'},
  {q:'¿Cuándo pasas a la siguiente actividad?',o:['Cuando al menos el 90% del grupo terminó; el examinador de apoyo guía a quienes van más lento','Cuando termina el primer estudiante','Cada 5 minutos exactos','Solo cuando termine el 100%, aunque demore'],b:-1,e:'Se avanza con al menos el 90% del grupo. Los que no logran avanzar son guiados por el examinador de apoyo hasta retomar el ritmo.',p:'32'},
  {q:'En la lámina hay una “palta” y un niño dice “aguacate”. ¿Qué haces?',o:['Nombro cada imagen en voz alta con el término exacto de la instrucción (“palta”)','Le digo que “aguacate” también vale y cambio la palabra','No digo nada para no ayudar','Le pregunto a Betsy cómo se dice'],b:3,e:'En las actividades 1 a 5 se nombra cada imagen en voz alta con el concepto exacto de las instrucciones, para que todos sepan a qué se refiere.',p:'33'},
  {q:'¿Cuándo empieza a correr el tiempo del módulo?',o:['Al terminar de leer las instrucciones: anoto la hora de inicio en el Formulario de Aplicación y escaneo el QR de la bolsa del módulo','Cuando reparto los cuadernillos','A las 09:00 en punto, haya o no instrucciones','Cuando Betsy me manda un audio'],b:3,e:'El tiempo cuenta desde que terminas de leer las instrucciones. Ahí registras la hora de inicio y escaneas el QR de la bolsa del módulo.',p:'26-27'},
  {q:'Un niño levanta la mano y pregunta cuál es la respuesta correcta. ¿Qué haces?',o:['Voy a su puesto, pero solo aclaro dudas sobre las instrucciones, nunca sobre el contenido','Le doy una pista chiquita','Le digo que venga a mi mesa','Le digo que le pregunte al compañero'],b:-1,e:'Los estudiantes levantan la mano y no se levantan del puesto. Solo respondes dudas de las instrucciones leídas, nunca del contenido.',p:'27'},
  {q:'Un estudiante saca su celular durante la prueba. ¿Qué haces?',o:['Le informo al docente de apoyo en aula, quien toma las medidas','Se lo quito y lo guardo en mi mochila','Le saco una foto como evidencia','Nada, no es mi problema'],b:-1,e:'Si un estudiante usa celular o algún dispositivo, informas al docente de apoyo, que toma las medidas (Ley 21.801). Tú tampoco puedes sacar fotos.',p:'11-12'}]},
 {x:12,y:5,icon:'recreo',name:'Recreo',time:'09:45',lines:[
  ['K','¡RECREOOO!'],
  ['BW','El recreo dura lo que dure el cafecito, no te preocupes.']],
  qs:[
  {q:'¿Cuánto dura el recreo y desde cuándo se cuenta?',o:['15 minutos, desde que sale el último estudiante de la sala','15 minutos, desde que sale el primero','30 minutos','Lo que dure el café'],b:3,e:'Recreo de 15 minutos, contados desde la salida del último estudiante.',p:'27'},
  {q:'¿Qué pasa con los cuadernillos del Módulo 1 durante el recreo?',o:['Quedan sobre el puesto (se siguen usando en el Módulo 2) y mientras tanto preparo láminas, parlante y pendrive','Los recojo y los guardo en la caja','Los niños se los llevan al recreo','Se los dejo a Betsy'],b:3,e:'El cuadernillo del Día 1 se usa en ambos módulos, así que queda en el puesto. Nunca dejes descuidado el material: es confidencial.',p:'28 y 43'}]},
 {x:12,y:2,icon:'parlante',name:'Módulo 2 (Act. 5 a 9)',time:'10:05',lines:[
  ['N','MÓDULO 2: Actividades 5 a 9. En la Actividad 8 (Comprensión oral) el curso escucha un cuento por el parlante.'],
  ['BW','El pendrive lo pones en el computador del colegio, ¿o no?']],
  qs:[
  {q:'¿Cómo reproduces el cuento de la Actividad 8?',o:['Conecto el pendrive al parlante: parte solo a los 6 segundos y se repite tras 30 segundos; el volumen se sube manteniendo el botón +','Lo pongo en el computador del colegio','Leo yo el cuento en voz alta','Lo pongo desde mi celular'],b:1,e:'Pendrive al parlante, reproducción automática a los 6 segundos y repetición a los 30 segundos para que todos escuchen bien.',p:'33'},
  {q:'El parlante no funciona. ¿Qué haces?',o:['Aviso de inmediato al supervisor, pido material de contingencia y lo registro en el Acta de Control de Eventos','Me salto la Actividad 8','Pido prestado el parlante de un niño','Leo el cuento a mi manera'],b:-1,e:'Ante cualquier discrepancia de material (parlante, pruebas faltantes, lápices, etc.) avisas de inmediato al supervisor, pides contingencia y lo registras en el Acta de Control de Eventos.',p:'23-24'},
  {q:'Suena la alarma de emergencia. ¿Qué haces?',o:['Mantengo la calma, apoyo al docente según el Plan de Emergencia del colegio, llevo el material si es posible, aviso al supervisor y lo registro en el Acta','Sigo con la prueba hasta terminar','Salgo corriendo y dejo todo','Llamo a Betsy para que decida'],b:-1,e:'El Plan de Emergencia se pidió en la visita previa. Después, el supervisor evalúa con su jefatura si se puede continuar.',p:'28'},
  {q:'¿Cuándo entregas el Cuestionario Apoderados(as)?',o:['Al terminar el Módulo 2: llamo a cada estudiante por su nombre, le entrego su cuestionario y puede retirarse','Al inicio del Módulo 1','Al día siguiente','Los dejo en una mesa para que cada uno saque uno'],b:-1,e:'Al finalizar el Módulo 2 los niños permanecen en sus puestos; los llamas por nombre y les entregas su cuestionario. La entrega queda registrada con la asistencia.',p:'29 y 33'}]},
 {x:8,y:2,icon:'caja',name:'Cierre del Día 1',time:'11:00',lines:[
  ['B','Bueno, guarda todo como sea y me pasas la caja, que me quiero ir.'],
  ['P','Tranquila, Betsy. Primero lo hago como dice el manual.']],
  qs:[
  {q:'¿Cómo ordenas los cuadernillos al cerrar el módulo?',o:['En orden ascendente de serie (el 01 abajo, encima el 02, y así) y verifico la cantidad con la lista','Como vayan saliendo','Por orden alfabético del nombre','En orden descendente'],b:1,e:'Cuenta y ordena en forma ascendente, verifica la cantidad según el Formulario Lista de Curso y guárdalos en sus bolsas de entrega.',p:'43'},
  {q:'Te falta un cuadernillo. ¿Qué haces?',o:['Informo de inmediato al supervisor y a las autoridades del establecimiento','Lo reemplazo con uno en blanco','No digo nada y cierro la caja','Lo busco mañana'],b:2,e:'Si falta alguna prueba, se informa inmediatamente y se sigue el Protocolo ante la pérdida de material.',p:'44 y 49'},
  {q:'¿A quién le entregas el Cuestionario Docente el Día 1?',o:['Al profesor jefe','Al director','A Betsy','A los apoderados'],b:2,e:'El Cuestionario Docente va al profesor jefe y se pide de vuelta el Día 2, junto con los de apoderados.',p:'15 y 44'},
  {q:'¿Qué debe hacer el director al final de cada día?',o:['Completar, firmar y timbrar el Acta de Control de Eventos (puede dejar observaciones y sacar copia)','Nada, solo despedirse','Revisar las respuestas de los niños','Sacarle fotos a las pruebas como respaldo'],b:-1,e:'Examinador y director completan y firman el Acta de Control de Eventos. El director solo puede fotocopiar o fotografiar el Formulario de Aplicación y el Formulario Lista de Curso.',p:'12 y 45'},
  {q:'Al terminar el Día 1, ¿qué haces con el Formulario de Aplicación y el Formulario Lista de Curso?',o:['Se los entrego a mi supervisor, para usarlos el Día 2','Los guardo en la caja-curso del Día 1','Me los llevo a la casa','Se los dejo al director'],b:-1,e:'Día 1: se entregan al supervisor. Día 2: se guardan en la caja-curso.',p:'44'},
  {q:'¿Cómo cierras la caja-curso?',o:['Dentro de la sala, con uno de los sellos azules del reverso de la tapa (el otro sirve de refuerzo)','Con cinta de embalaje cualquiera','La dejo abierta para que la cierre la supervisora','Con el sello rojo'],b:2,e:'La caja se cierra en la sala, después de la firma de las Actas, con el sello azul. Luego la devuelves según lo coordinado con el supervisor.',p:'22 y 47'}]}

function rng(seed){return()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};}
function buildMap(){
  const st=day().stations;grid=Array.from({length:10},()=>Array(15).fill(0));
  for(let y=0;y<10;y++)for(let x=0;x<15;x++)if(x===0||x===14||y===0||y===9)grid[y][x]=2;
  for(let i=0;i<st.length-1;i++){const a=st[i],b=st[i+1];
    for(let x=Math.min(a.x,b.x);x<=Math.max(a.x,b.x);x++)grid[a.y][x]=1;
    for(let y=Math.min(a.y,b.y);y<=Math.max(a.y,b.y);y++)grid[y][b.x]=1;}
  st.forEach(s=>grid[s.y][s.x]=1);
  for(let y=6;y<=7;y++)for(let x=1;x<=3;x++)grid[y][x]=6;
  for(let y=5;y<=7;y++)for(let x=4;x<=7;x++)grid[y][x]=5;
  grid[6][8]=5;grid[7][8]=5;
  const res=new Set(NPCS[S.day].map(n=>n.x+','+n.y));const cp=carPos();res.add(cp.x+','+cp.y);res.add((cp.x+1)+','+cp.y);grid[cp.y][cp.x]=4;grid[cp.y][cp.x+1]=4;
  const r=rng(S.day*977+31);
  for(let y=1;y<9;y++)for(let x=1;x<14;x++){if(grid[y][x]!==0||res.has(x+','+y))continue;
    const near=st.some(s=>Math.abs(s.x-x)<=1&&Math.abs(s.y-y)<=1);const v=r();
    if(!near&&v<.12)grid[y][x]=2;else if(v>.86)grid[y][x]=3;}
  mapC=document.createElement('canvas');mapC.width=240;mapC.height=160;const g=mapC.getContext('2d');const r2=rng(S.day*31+5);
  const grassA=S.day?'#70c068':'#68c060',grassB=S.day?'#58a850':'#50a84c';

  const n=npcAt(nx,ny);if(n){if(n.quip&&performance.now()-lastToast>2200){lastToast=performance.now();toast(n.quip);}return;}

    const p=openPanel(`<div class="title"><h2>¡FIN DEL DÍA 1!</h2><div class="stars">★ ${S.stars} / ${q1}</div>
    <div class="betsy"><img src="${IMGSRC.betsy_front}" alt="" style="width:27px"><div>Betsy: “¡Bien, {n}! Mañana es igual, ¿cierto? ...¿No? ¿Hay grabadora? Nadie me dijo nada.”</div></div>
    <p>Mañana: Comprensión de lectura y Fluidez lectora.<br>Los abrazos de ${esc(kidN())} se recargan.</p></div><button class="opt main">Ir al Día 2 ▶</button>`.replace(/\{n\}/g,esc(S.name)));
    p.querySelector('.opt.main').onclick=()=>{S.day=1;S.stage=0;S.pw={hug:2};save();loadDay();closePanel();sfx.start();trigger();};}
  else finalScreen();}

function finalScreen(){const pct=S.stars/TOTAL;
  const rank=pct>=.9?['EXAMINADOR LEGENDARIO','Betsy: “Te felicito. Yo sabía que te iba a ir bien... ¿era de 2° básico, cierto?”']:pct>=.7?['EXAMINADOR CERTIFICADO','Betsy: “Muy bien. La próxima te paso yo el dato del horario.” (Mejor no.)']:pct>=.5?['EXAMINADOR EN PRÁCTICA','Betsy: “Tranquilo, yo tampoco me lo sé y aquí estoy.”']:['NIVEL BETSY','Betsy: “¡Eso! Igualito que yo.” Conviene repasar el torpedo...'];
  const errs=S.wrong.length?S.wrong.map(w=>`<div class="err"><b>Día ${w.d+1}:</b> ${esc(w.q)}<br>✔ ${esc(w.a)} <span class="small">(pág. ${esc(w.p)})</span></div>`).join(''):'<p>Sin errores. Ni Betsy pudo confundirte.</p>';
  const p=openPanel(`<div class="title"><h2>¡APLICACIÓN COMPLETA!</h2><div class="stars">★ ${S.stars} / ${TOTAL}</div><div class="tag">${rank[0]}</div>
  <div class="chars"><div><img src="${IMGSRC.dad_front}" alt="" style="width:64px"><small>${esc(S.name)}</small></div><div><img src="${IMGSRC.betsy_front}" alt="" style="width:54px;margin-top:54px"><small>Betsy</small></div></div>
  <div class="betsy"><img src="${IMGSRC.betsy_front}" alt="" style="width:27px"><div>${esc(rank[1])}</div></div></div>
  <h3>Para repasar</h3>${errs}
  <button class="opt main" id="fM">Ver torpedo</button><button class="opt" id="fR">Jugar de nuevo</button>`);
  p.querySelector('#fM').onclick=()=>torpedo(finalScreen);
  p.querySelector('#fR').onclick=()=>{S=fresh();try{localStorage.removeItem(KEY);}catch(e){}titleScreen();};}

function torpedo(back){const li=a=>'<ul class="m">'+a.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>';
  const p=openPanel(`<h2>TORPEDO</h2>
  <div class="timeline"><b>08:00</b><span>Llegar al colegio</span><b>08:20</b><span>En la sala</span><b>08:30</b><span>Formar al curso</span><b>08:45</b><span>Límite de ingreso</span><b>09:00</b><span>Inicio de la aplicación</span><b>15'</b><span>Recreo (desde que sale el último)</span></div>
  <h3>Día 1 · Precursores de la lectura</h3>${li(TORPEDO.d1)}<h3>Día 2 · Comprensión y Fluidez</h3>${li(TORPEDO.d2)}<h3>Siempre</h3>${li(TORPEDO.siempre)}
  <p class="small">Fuente: Manual de Aplicación Impulso Lector 2026, Agencia de Calidad de la Educación.</p>
  <button class="opt main" data-back>Volver</button>`);
  p.querySelector('[data-back]').onclick=()=>{if(back)back();else{closePanel();mode='map';}};}

function menu(){const p=openPanel(`<h2>PAUSA</h2><p>${esc(day().title)} · ${esc(day().sub)}<br>★ ${S.stars} · Preguntas respondidas: ${S.answered}/${TOTAL}</p>
  <button class="opt main" data-back>Continuar</button><button class="opt" id="mM">Torpedo</button><button class="opt" id="mMu">Música: ${music?'ON':'OFF'}</button><button class="opt" id="mS">Efectos: ${snd?'ON':'OFF'}</button><button class="opt" id="mR">Volver al inicio</button>`);
  p.querySelector('[data-back]').onclick=()=>{closePanel();mode='map';};
  p.querySelector('#mM').onclick=()=>torpedo(menu);
  p.querySelector('#mS').onclick=()=>{snd=!snd;menu();};
  p.querySelector('#mMu').onclick=()=>{music=!music;if(!music)stopMusic();else{musicStarted=true;ensureCtx();}menu();};
  p.querySelector('#mR').onclick=()=>titleScreen();}

function titleScreen(){const sv=loadSave();S=sv?Object.assign(fresh(),sv):fresh();S.name='Samuel';S.kid='Gabriel';
  if(S.day>1)S.day=1;buildMap();placePlayer();
  const contTxt=sv?(sv.day===1&&sv.stage>=DAYS[1].stations.length?'Ver resultado':`Continuar (${DAYS[sv.day].title}, ★ ${sv.stars})`):'';
  const p=openPanel(`<div class="title"><div class="logo">IMPULSO<br>LECTOR</div><div class="sub">La aventura del examinador · Escuela de Matilla · 2° básico</div><div class="small">¿Dónde está Betsy? Ahh... en su auto, en el estacionamiento.</div>
  <div class="chars" style="align-items:flex-end"><div><img src="${IMGSRC.dad_front}" alt="" style="width:64px"><small>Samuel</small></div><div><img src="${IMGSRC.kid_front}" alt="" style="width:38px"><small>Gabriel</small></div><div><img src="${IMGSRC.betsy_front}" alt="" style="width:54px"><small>Betsy</small></div></div>
  <p>Recorre el colegio paso a paso durante el Día 1 y el Día 2. Betsy te pondrá a prueba: responde lo que dice el manual... no lo que dice ella. Gabriel tiene un superpoder para ayudarte.</p></div>
  <button class="opt main" id="tN">Nueva partida ▶</button>${sv?`<button class="opt" id="tC">${esc(contTxt)}</button>`:''}<button class="opt" id="tM">Ver torpedo</button>
  <p class="small">Controles: flechas / WASD o la cruz · A (Enter) avanzar · START menú (música y efectos) · SELECT torpedo. Sube el volumen: tiene música.</p>
  <p class="small">Basado en el Manual de Aplicación Impulso Lector 2026 (Agencia de Calidad de la Educación). Betsy es un personaje humorístico.</p>`,0);
  mode='title';
  const go=()=>{S=fresh();save();loadDay();closePanel();sfx.start();trigger();};
  p.querySelector('#tN').onclick=go;
  if(sv)p.querySelector('#tC').onclick=()=>{S=Object.assign(fresh(),sv);S.name='Samuel';S.kid='Gabriel';loadDay();closePanel();
    if(S.stage>=day().stations.length)dayEnd();else if(S.stage===0){sfx.start();trigger();}else mode='map';};
  p.querySelector('#tM').onclick=()=>torpedo(titleScreen);}

/* ================= CONTROLES ================= */
function pressA(){if(mode==='dialog')advanceDialog();else if(ctl)ctl.a();}
function pressB(){if(mode==='dialog')advanceDialog();else if(ctl)ctl.b();}
function dirPress(d){if(mode==='map')held=d;else if(ctl&&(d==='up'||d==='down'))ctl.move(d==='up'?-1:1);}
const KM={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const d=KM[e.key];
  if(d){e.preventDefault();if(mode==='map')held=d;else if(!e.repeat||mode!=='map')dirPress(d);return;}
  if(e.key==='Enter'||e.key===' '||e.key==='z'||e.key==='Z'){e.preventDefault();pressA();return;}
  if(e.key==='x'||e.key==='X'||e.key==='Escape'||e.key==='Backspace'){pressB();return;}
  if(e.key==='m'||e.key==='M'){if(mode==='map')menu();}});
addEventListener('keyup',e=>{if(KM[e.key]===held)held=null;});
document.querySelectorAll('#dpad button').forEach(b=>{const d=b.dataset.d;
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('on');dirPress(d);});
  const up=()=>{b.classList.remove('on');if(held===d)held=null;};
  b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up);});
$('bA').addEventListener('pointerdown',e=>{e.preventDefault();pressA();});
$('bB').addEventListener('pointerdown',e=>{e.preventDefault();pressB();});
$('bStart').addEventListener('click',()=>{if(mode==='map')menu();else if(mode==='title')$('tN')&&$('tN').click();});
$('bSel').addEventListener('click',()=>{if(mode==='map')torpedo();});

titleScreen();loop();
</script>
</body>
</html>
